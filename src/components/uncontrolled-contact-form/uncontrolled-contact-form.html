<form #contactForm="ngForm" (ngSubmit)="onSubmit(contactForm)" class="contact-form">
  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" [(ngModel)]="contact.name" 
           #name="ngModel" required minlength="2" class="form-control">
    <div *ngIf="name.invalid && name.touched" class="error">
      <span *ngIf="name.errors?.['required']">Name is required</span>
      <span *ngIf="name.errors?.['minlength']">Name must be at least 2 characters</span>
    </div>
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" [(ngModel)]="contact.email" 
           #email="ngModel" required email class="form-control">
    <div *ngIf="email.invalid && email.touched" class="error">
      <span *ngIf="email.errors?.['required']">Email is required</span>
      <span *ngIf="email.errors?.['email']">Please enter a valid email</span>
    </div>
  </div>

  <div class="form-group">
    <label for="message">Message</label>
    <textarea id="message" name="message" [(ngModel)]="contact.message" 
              #message="ngModel" required minlength="10" class="form-control" rows="4"></textarea>
    <div *ngIf="message.invalid && message.touched" class="error">
      <span *ngIf="message.errors?.['required']">Message is required</span>
      <span *ngIf="message.errors?.['minlength']">Message must be at least 10 characters</span>
    </div>
  </div>

  <button type="submit" [disabled]="contactForm.invalid" class="submit-btn">Submit</button>
</form>
